name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --version
      - name: zero runtime dependencies
        run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length) { console.error('runtime deps are not allowed'); process.exit(1) }"

  # The published CLI supports Node 20.10+, but the test suite needs Node 22.18+ (type
  # stripping). Build with a current Node, then smoke-test the built CLI on Node 20.
  node20-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.10"
      - name: Smoke test on Node 20
        env:
          SELFGUARD_NO_NOTIFY: "1"
        run: |
          node --version
          node dist/cli.js --version
          export SELFGUARD_HOME="$RUNNER_TEMP/sg"
          mkdir -p "$RUNNER_TEMP/p"
          cp test/fixtures/real/manifest.fixture.json "$RUNNER_TEMP/p/package.json"
          cp test/fixtures/real/pnpm/lockfile.fixture.yaml "$RUNNER_TEMP/p/pnpm-lock.yaml"
          node dist/cli.js scan "$RUNNER_TEMP/p" --json > out.json || test $? -eq 1
          node -e 'const r=require("./out.json"); if (r.project.packages !== 12) throw new Error("expected 12 packages, got " + r.project.packages); console.log("ok:", r.project.vulnerablePackages, "vulnerable packages")'

