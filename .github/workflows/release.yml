# Publishes to npm with Trusted Publishing (OIDC) + provenance: no long-lived npm token exists
# anywhere, so a stolen token cannot be used to push a malicious version.
# Setup once on npmjs.com: package settings → Trusted Publisher → GitHub Actions, this repo + workflow.
name: release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test && npm run build
      - run: npm publish --provenance --access public
