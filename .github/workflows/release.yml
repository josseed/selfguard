# Stages a release on npm with Trusted Publishing (OIDC) + provenance. No long-lived npm token
# exists anywhere, and CI cannot publish directly: the version waits on npmjs.com until a
# maintainer approves it with 2FA (`npm stage approve <id>` or the website).
# Setup on npmjs.com: package → Access → Trusted Publisher → GitHub Actions, this repo,
# workflow release.yml, environment npm, with "Allow npm publish" UNCHECKED (stage only).
name: release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test && npm run build
      - name: Check the tag matches package.json
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
      # `npm stage` needs npm >= 12 (pinned exact version).
      - run: npm install -g npm@12.2.2 --ignore-scripts
      - name: Stage the release (approve it on npmjs.com with 2FA)
        run: npm stage publish --provenance --access public

  # The Mac app: Developer ID-signed, notarized and stapled DMGs attached to the release.
  # Runs in the `macos-release` environment (required reviewer), the only place the Apple
  # secrets exist. Setup: docs/releasing-mac-app.md.
  # The macOS 26 SDK is needed (NSGlassEffectView); keep it the same image as ci.yml's macos-app.
  macos-app:
    runs-on: macos-26
    environment: macos-release
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test
      - name: Check the tag matches package.json
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass="$(openssl rand -hex 24)"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity" || { echo "no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/build-app.sh
      - name: Notarize and package
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          scripts/notarize-app.sh
          rm -f "$APPLE_API_KEY_PATH"
      # Sparkle: the DMG's EdDSA signature goes into this architecture's appcast, and the feed
      # itself is signed too (the app requires both, plus Apple's signature of the new app).
      - name: Sign the update and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          ARCH: ${{ matrix.arch }}
        run: |
          key="$RUNNER_TEMP/sparkle.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key")
          test -s "$key" || { echo "SPARKLE_ED_PRIVATE_KEY is missing"; exit 1; }
          su=macos/.build/artifacts/sparkle/Sparkle/bin/sign_update
          dmg="$(ls macos/build/selfguard-*-"$ARCH".dmg)"
          out="$("$su" --ed-key-file "$key" "$dmg")"
          sig="$(sed -E 's/.*edSignature="([^"]+)".*/\1/' <<<"$out")"
          len="$(sed -E 's/.*length="([0-9]+)".*/\1/' <<<"$out")"
          node scripts/appcast.mjs "$dmg" "$ARCH" "$sig" "$len"
          "$su" --ed-key-file "$key" "macos/build/appcast-$ARCH.xml"
          "$su" --ed-key-file "$key" --verify "macos/build/appcast-$ARCH.xml"
          "$su" --ed-key-file "$key" --verify "$dmg" "$sig"
      - name: Attach the DMG, its checksum and the appcast to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd macos/build
          dmg="$(ls selfguard-*.dmg)"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          gh release upload "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" "appcast-$ARCH.xml" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
