name: pr target
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: "${{ github.head_ref }}"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
      - name: not a checkout
        uses: some/other@0123456789abcdef0123456789abcdef01234567
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: echo "ref: ${{ github.event.pull_request.head.sha }}"
