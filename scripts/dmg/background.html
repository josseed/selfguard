<!doctype html>
<!--
  The background of the DMG window: what you see when you open selfguard-<version>-<arch>.dmg.
  Rendered to macos/Resources/dmg/background.png (@1x and @2x) by scripts/dmg/render.mjs; the
  icon positions it leaves room for are in scripts/dmg/settings.py. Bastion is the first frame
  of his idle scene (src/ui/static/mascot/idle.png, exported from scripts/mascot/bastion.html).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Keep in sync with scripts/dmg/settings.py: window size, icon centers and icon size. */
  :root { --w: 640px; --h: 420px; --app-x: 170px; --apps-x: 470px; --icons-y: 200px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: var(--w); height: var(--h); overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(520px 300px at 12% -12%, #1f2650 0, transparent 70%),
      radial-gradient(460px 280px at 108% -6%, #2a1840 0, transparent 62%),
      #0a0d17;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: absolute; inset: 0; width: var(--w); height: var(--h); image-rendering: pixelated; }
  header { position: absolute; top: 34px; left: 0; right: 0; text-align: center; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.015em; }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, #4fa3ff 10%, #38e1ff 50%, #bf5af2 95%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 6px 0 0; font-size: 13px; color: rgba(235, 235, 245, .62); }
  /* A soft pool of light under each icon, so they sit on something. */
  .spot {
    position: absolute; top: calc(var(--icons-y) - 78px); width: 170px; height: 170px; margin-left: -85px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(56, 225, 255, .10), transparent);
  }
</style>
</head>
<body>
  <header>
    <h1>Drag <em>selfguard</em> into Applications</h1>
    <p>Bastion takes his post at the gate of your Mac.</p>
  </header>
  <div class="spot" style="left: var(--app-x)"></div>
  <div class="spot" style="left: var(--apps-x)"></div>
  <canvas id="art"></canvas>
<script>
// Pixel art at 1 logical pixel = 2 CSS pixels (so @2x is 4 device pixels per art pixel).
const PX = 2, W = 640 / PX, H = 420 / PX;
const ICONS_Y = 200 / PX, FROM = 252 / PX, TO = 388 / PX;
const C = {
  cyan: "#38e1ff", cyanD: "#1f8fb0", K: "#0d101c",
  stone: "#1a2138", stoneL: "#262f4d", stoneD: "#121729", mortar: "#0f1424", torch: "#ffc94a", flame: "#ff5a6e",
};
const cv = document.getElementById("art");
cv.width = W; cv.height = H;
const c = cv.getContext("2d");
const px = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };

// Stars: fixed positions, so every render is identical.
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < 46; i++) {
  const x = Math.floor(rnd() * W), y = Math.floor(rnd() * 150);
  if (y > 12 && y < 46 && x > 60 && x < 260) continue; // keep the title clean
  px(x, y, 1, 1, rnd() < .25 ? "rgba(56,225,255,.55)" : "rgba(235,235,245,.28)");
}

// The way in: dotted trail and a chevron, from the app to Applications.
const glow = (draw) => {
  c.save(); c.shadowColor = "rgba(56,225,255,.75)"; c.shadowBlur = 6; draw(); c.restore(); draw();
};
glow(() => {
  for (let x = FROM; x < TO - 12; x += 6) px(x, ICONS_Y - 1, 3, 2, C.cyanD);
  for (let x = FROM + 18; x < TO - 12; x += 6) px(x, ICONS_Y - 1, 3, 2, C.cyan);
  // chevron, 2px thick
  for (let i = 0; i < 7; i++) {
    px(TO - 12 + i, ICONS_Y - 7 + i, 2, 1, C.cyan);
    px(TO - 12 + i, ICONS_Y + 6 - i, 2, 1, C.cyan);
  }
  px(TO - 6, ICONS_Y - 1, 2, 2, C.cyan);
});

// The castle wall along the bottom: battlements, bricks, two torches.
const TOP = 186;
px(0, TOP, W, H - TOP, C.stone);
px(0, TOP, W, 1, C.stoneL);
for (let row = 0; TOP + 3 + row * 6 < H; row++) {
  const y = TOP + 3 + row * 6;
  px(0, y, W, 1, C.mortar);
  for (let x = (row % 2) * 7; x < W; x += 14) px(x, y + 1, 1, 5, C.mortar);
}
for (let x = 2; x < W; x += 16) {
  px(x, TOP - 7, 10, 7, C.stone);
  px(x, TOP - 7, 10, 1, C.stoneL);
  px(x + 9, TOP - 6, 1, 6, C.stoneD);
}
for (const tx of [44, W - 46]) {
  px(tx, TOP - 16, 2, 9, "#5c3a20");
  px(tx - 1, TOP - 19, 4, 3, C.torch);
  px(tx, TOP - 21, 2, 2, C.flame);
  c.save(); c.globalCompositeOperation = "lighter";
  const g = c.createRadialGradient(tx + 1, TOP - 19, 0, tx + 1, TOP - 19, 22);
  g.addColorStop(0, "rgba(255,201,74,.22)"); g.addColorStop(1, "rgba(255,201,74,0)");
  c.fillStyle = g; c.fillRect(tx - 22, TOP - 41, 46, 46);
  c.restore();
}

// Bastion on the wall, between the two icons. His frame is 94×43 with him at the left.
const img = new Image();
img.onload = () => {
  const s = document.createElement("canvas"); s.width = 94; s.height = 43;
  const sc = s.getContext("2d"); sc.drawImage(img, 0, 0, 94, 43, 0, 0, 94, 43);
  const d = sc.getImageData(0, 0, 94, 43).data;
  let x0 = 94, x1 = -1, y1 = -1;
  for (let y = 0; y < 43; y++) for (let x = 0; x < 50; x++) if (d[(y * 94 + x) * 4 + 3] > 0) {
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
  }
  const bw = x1 - x0 + 1;
  c.drawImage(s, x0, 0, bw, y1 + 1, Math.round(W / 2 - bw / 2), TOP - 7 - (y1 + 1), bw, y1 + 1);
  document.body.dataset.ready = "1";
};
img.src = "../../src/ui/static/mascot/idle.png";
</script>
</body>
</html>
